services:
  - type: web
    name: gamehub-backend
    runtime: node
    region: oregon
    plan: free
    autoDeploy: true
    
    buildCommand: npm install
    startCommand: npm start
    
    healthCheckPath: /health
    healthCheckInterval: 30
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: true
      
      # API Keys (set these in Render dashboard)
      - key: RAWG_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: TMDB_API_TOKEN
        sync: false
      
      # Community features (see gamehub-main/COMMUNITY_SETUP.md in the frontend repo)
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STEAM_API_KEY
        sync: false
      # Encrypts stored Xbox / PlayStation keys for achievement auto-sync (any long random string)
      - key: PLATFORM_TOKEN_KEY
        sync: false
      - key: ITAD_API_KEY
        sync: false

      # Cache Duration
      - key: CACHE_DURATION_EXTERNAL_API
        value: "600"
      - key: CACHE_DURATION_MOVIES
        value: "1800"
      - key: CACHE_DURATION_NEWS
        value: "900"
      
      # CORS
      - key: CORS_ORIGIN
        value: "*"
